<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001233"/>
      <stop offset="100%" stop-color="#002855"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703"/>
      <stop offset="50%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#2D5A27"/>
    </linearGradient>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Outer Glow -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.35"/>

  <!-- Globe Ring Background -->
  <circle cx="256" cy="230" r="130" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.15"/>
  <ellipse cx="256" cy="230" rx="65" ry="130" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.15"/>
  <line x1="126" y1="230" x2="386" y2="230" stroke="#FFFFFF" stroke-width="2" opacity="0.15"/>

  <!-- Central Organic Leaf & Export Crest -->
  <path d="M256 120 C320 150 360 210 350 290 C340 370 270 390 256 390 C242 390 172 370 162 290 C152 210 192 150 256 120 Z" fill="url(#goldGrad)"/>

  <!-- Inner Leaf Detail -->
  <path d="M256 140 C295 180 320 230 310 290 C290 320 265 340 256 360 C247 340 222 320 202 290 C192 230 217 180 256 140 Z" fill="url(#greenGrad)"/>

  <!-- Center Stem -->
  <path d="M256 150 L256 360" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <path d="M256 220 C275 205 295 210 295 210" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <path d="M256 260 C235 245 215 250 215 250" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.75"/>

  <!-- Golden Stars of Quality -->
  <polygon points="256,70 262,85 278,85 265,95 270,110 256,100 242,110 247,95 234,85 250,85" fill="#FFB703"/>

  <!-- Bottom Brand Text -->
  <text x="256" y="440" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="4">ARCAVENTURE</text>
  <text x="256" y="475" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="700" font-size="18" fill="#FF8C00" letter-spacing="8">GLOBAL EXPORT</text>
</svg>
